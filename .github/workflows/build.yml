name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.8.3"
  VCPKG_COMMIT: "9e593bb18ea69cc5095e012465dcd675a822ed0d"  # vcpkg 2026.07.29, pins GDCM 3.0.24 / Catch2 3.7.1
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-22.04          # oldest supported glibc for the AppImage
            preset: linux-release
            qt_arch: linux_gcc_64
          - name: Windows x64
            os: windows-2022
            preset: windows-msvc-release
            qt_arch: win64_msvc2022_64
          - name: macOS Apple Silicon
            os: macos-14
            preset: macos-arm64-release
            qt_arch: clang_64
          - name: macOS Intel
            os: macos-13
            preset: macos-x86_64-release
            qt_arch: clang_64

    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libfuse2 file locales
          # Comma-decimal locale for the "DS parsing does not depend on the process locale" test.
          sudo locale-gen pt_BR.UTF-8

      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qtimageformats
          cache: true

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Smoke test with synthetic exam
        shell: bash
        run: |
          BIN=build/${{ matrix.preset }}
          if [ "$RUNNER_OS" == "Windows" ]; then
            "$BIN/tests/Release/make_phantom.exe" phantom --small
            "$BIN/bin/Release/VisualTC.exe" --mpr --screenshot smoke.png phantom
          elif [ "$RUNNER_OS" == "macOS" ]; then
            "$BIN/tests/make_phantom" phantom --small
            "$BIN/bin/VisualTC.app/Contents/MacOS/VisualTC" --mpr --screenshot smoke.png phantom
          else
            "$BIN/tests/make_phantom" phantom --small
            "$BIN/bin/VisualTC" --mpr --screenshot smoke.png phantom
          fi
          test -s smoke.png

      # ------------------------------------------------------------ packaging
      - name: Package (Linux AppImage + DEB)
        if: runner.os == 'Linux'
        run: |
          cmake --install build/${{ matrix.preset }} --prefix AppDir/usr
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_PLATFORM_PLUGINS="libqwayland-generic.so"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/VisualTC --executable AppDir/usr/bin/visualtc-worker \
            --desktop-file packaging/linux/visualtc.desktop --icon-file packaging/linux/visualtc.png \
            --plugin qt --output appimage
          mkdir -p dist
          mv VisualTC*.AppImage dist/VisualTC-x86_64.AppImage
          # .deb: the same self-contained tree as the AppImage (private Qt
          # 6.8 under /opt/visualtc, since Ubuntu LTS ships older Qt 6).
          VERSION=$(grep -m1 -oP '^\s+VERSION \K[0-9.]+' CMakeLists.txt)
          mkdir -p deb/DEBIAN deb/opt/visualtc deb/usr/bin deb/usr/share/applications \
                   deb/usr/share/icons/hicolor/scalable/apps
          cp -a AppDir/usr/. deb/opt/visualtc/
          ln -s /opt/visualtc/bin/VisualTC deb/usr/bin/visualtc
          sed 's|^Exec=.*|Exec=/opt/visualtc/bin/VisualTC %F|' packaging/linux/visualtc.desktop \
            > deb/usr/share/applications/visualtc.desktop
          cp resources/icons/app.svg deb/usr/share/icons/hicolor/scalable/apps/visualtc.svg
          cat > deb/DEBIAN/control <<EOF
          Package: visualtc
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: ${VISUALTC_MAINTAINER:-VisualTC Maintainers <maintainers@example.invalid>}
          Depends: libc6 (>= 2.35), libgl1, libegl1, libfontconfig1, libfreetype6, libxkbcommon0, libxkbcommon-x11-0, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-randr0, libxcb-render-util0, libxcb-shape0, libxcb-xinerama0, libdbus-1-3
          Section: science
          Priority: optional
          Description: VisualTC - DICOM Medical Image Viewer
           Offline desktop DICOM viewer for CT, MR and other modalities:
           spatial sorting, window/level, measurements, ROI in HU and MPR.
          EOF
          dpkg-deb --root-owner-group --build deb dist/visualtc_amd64.deb
          dpkg-deb --info dist/visualtc_amd64.deb

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item build/${{ matrix.preset }}/bin/Release/*.exe stage/
          Copy-Item build/${{ matrix.preset }}/bin/Release/*.dll stage/ -ErrorAction SilentlyContinue
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-opengl-sw stage/VisualTC.exe
          Copy-Item README.md, THIRD_PARTY_LICENSES.md stage/
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DSourceDir="$PWD\stage" /DOutputDir="$PWD\dist" packaging/windows/visualtc.iss

      - name: Package (macOS DMG)
        if: runner.os == 'macOS'
        run: |
          APP=build/${{ matrix.preset }}/bin/VisualTC.app
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -executable="$APP/Contents/MacOS/visualtc-worker"
          # Ad-hoc signature (replace with Developer ID + notarization for distribution, see docs/BUILD.md)
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          hdiutil create -volname VisualTC -srcfolder "$APP" -ov -format UDZO dist/VisualTC.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: VisualTC-${{ matrix.preset }}
          path: |
            dist/*
            smoke.png
          if-no-files-found: warn

  sanitizers-and-analysis:
    name: ASan/UBSan + clang-tidy (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev clang-tidy libxkbcommon-x11-0 libxcb-cursor0 locales
          sudo locale-gen pt_BR.UTF-8
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: cmake --preset linux-debug-asan
      - run: cmake --build --preset linux-debug-asan --parallel
      - name: Tests under AddressSanitizer + UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --preset linux-debug-asan
      - name: clang-tidy (core library)
        run: |
          run-clang-tidy -p build/linux-debug-asan -quiet \
            "src/(core|dicom|imaging|measurements|mpr|synchronization)/.*\.cpp$"
