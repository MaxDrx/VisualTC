name: download-page

# Publishes site/ (the download page, in Portuguese) on GitHub Pages:
#   https://<dono>.github.io/<repo>/
# One-time setup: Settings > Pages > Source: "GitHub Actions".
# The page links to releases/latest/download/<arquivo>, so it does not need
# to change when a new version is released.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Point the download buttons to this repository
        run: sed -i "s|__REPO__|${GITHUB_REPOSITORY}|g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
